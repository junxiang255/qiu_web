<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta HTTP-EQUIV="pragma" CONTENT="no-cache">
    <title>开发人员 · 小秋的垃圾站</title>
    <meta name="description" content="小秋的垃圾站开发人员名单——看看是谁在做这个站，前端、后端、运维分工一目了然。">
    <link rel="shortcut icon" href="static/img/favicon.ico">
    <link rel="stylesheet" href="static/css/font.css">
    <link rel="stylesheet" href="static/css/style.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px 16px 60px;
            box-sizing: border-box;
            background: linear-gradient(rgba(255, 255, 255, .2), rgba(255, 255, 255, .3)),
                        url("static/img/background.png") center/cover no-repeat fixed;
            font-family: "筑紫A圆体D", system-ui, sans-serif;
            color: #1f1f1f;
        }

        .wrap { width: min(920px, 100%); margin: 0 auto; }

        .bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 18px;
            border-radius: 18px;
            background: rgba(255, 255, 255, .78);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, .66);
            box-shadow: rgb(0 0 0 / 0.12) 0px 8px 28px 0px;
        }

        .back {
            font-size: .84rem;
            color: #333;
            text-decoration: none;
            padding: 7px 15px;
            border-radius: 11px;
            background: rgba(255, 255, 255, .6);
            border: 1px solid rgba(0, 0, 0, .07);
            transition: all .3s ease;
        }

        .back:hover { background: #789bfa71; box-shadow: 0 0 18px #e6b5e6; }

        .bar .title {
            margin-left: auto;
            font-size: .82rem;
            letter-spacing: 2px;
            color: #7d838c;
        }

        .devs {
            margin-top: 16px;
            padding: 26px 24px 28px;
            border-radius: 22px;
            background: rgba(255, 255, 255, .74);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, .66);
            box-shadow: rgb(0 0 0 / 0.13) 0px 12px 36px 0px;
            animation: fade_in .5s ease-out both;
        }

        .devs-title {
            margin: 0 0 20px;
            font-size: 1.15rem;
            letter-spacing: 4px;
            text-align: center;
            color: #1f1f1f;
        }

        .dev-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 12px;
        }

        .dev-card {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            padding: 14px;
            border-radius: 14px;
            background: rgba(255, 255, 255, .72);
            border: 1px solid rgba(255, 255, 255, .5);
            box-shadow: rgb(0 0 0 / 0.06) 0px 4px 14px 0px;
            transition: all .3s ease;
        }

        .dev-card:hover {
            background: rgba(255, 255, 255, .95);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgb(0 0 0 / 0.12);
        }

        .dev-card img {
            width: 52px;
            height: 52px;
            flex: 0 0 52px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 3px 10px rgb(0 0 0 / 0.16);
        }

        .dev-name {
            margin: 2px 0 4px;
            font-size: .86rem;
            font-weight: 700;
            color: #1f1f1f;
        }

        .dev-name a { color: inherit; text-decoration: none; }
        .dev-name a:hover { color: #1100ff; text-decoration: underline; }

        .dev-desc {
            margin: 0;
            font-size: .72rem;
            line-height: 1.75;
            color: #6b7280;
        }

        .dev-cta {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px;
            border-radius: 14px;
            text-align: center;
            background: rgba(255, 255, 255, .5);
            border: 1px dashed rgba(0, 0, 0, .16);
        }

        .dev-cta strong { font-size: .82rem; color: #4b5563; }
        .dev-cta img { max-width: 100%; width: 120px; border-radius: 10px; }

        @keyframes fade_in {
            0% { opacity: 0; transform: translateY(12px); }
            100% { opacity: 1; transform: none; }
        }
    </style>
    <!-- Microsoft Clarity -->
    <script>
        (function(c,l,a,r,i,t,y){

            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "zim1v5iu9g");

</head>
