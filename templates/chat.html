<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>取代垃圾桶 · 小秋的垃圾站</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/font.css') }}">
    <style>
        * { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            background: linear-gradient(rgba(255, 255, 255, .2), rgba(255, 255, 255, .3)),
                        url("{{ url_for('static', filename='img/background.png') }}") center/cover no-repeat fixed;
            font-family: "筑紫A圆体D", system-ui, sans-serif;
            color: #1f1f1f;
        }

        .wrap {
            width: min(760px, 100%);
            margin: 0 auto;
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        /* 顶栏 */
        .bar {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            border-radius: 18px;
            background: rgba(255, 255, 255, .8);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, .66);
            box-shadow: rgb(0 0 0 / 0.12) 0px 8px 28px 0px;
            margin-bottom: 12px;
        }

        .back {
            font-size: .8rem;
            color: #333;
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 11px;
            background: rgba(255, 255, 255, .6);
            border: 1px solid rgba(0, 0, 0, .07);
            transition: all .3s ease;
        }

        .back:hover { background: #789bfa71; box-shadow: 0 0 18px #e6b5e6; }

        .title {
            font-size: .9rem;
            font-weight: 700;
            letter-spacing: 3px;
        }

        .who {
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: .76rem;
            color: #444;
            text-decoration: none;
        }

        .who img {
            width: 26px; height: 26px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #fff;
            box-shadow: 0 2px 8px rgb(0 0 0 / .18);
        }

        /* 消息区 */
        .msgs {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            padding: 16px 14px;
            border-radius: 18px;
            background: rgba(255, 255, 255, .62);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, .55);
            box-shadow: rgb(0 0 0 / 0.1) 0px 8px 26px 0px;
            scroll-behavior: smooth;
        }

        .msgs::-webkit-scrollbar { width: 6px; }
        .msgs::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, .12); border-radius: 3px; }

        .msg {
            display: flex;
            gap: 9px;
            margin-bottom: 14px;
            align-items: flex-start;
        }

        .msg.mine { flex-direction: row-reverse; }

        .msg img.av,
        .msg .avf {
            width: 34px; height: 34px;
            flex: 0 0 34px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #fff;
            box-shadow: 0 2px 8px rgb(0 0 0 / .16);
            background: linear-gradient(135deg, #e7ecf7, #cfd9ec);
        }

        .msg .avf {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .8rem;
            font-weight: 700;
            color: #7d8798;
        }

        .bubble-wrap { max-width: 74%; }

        .meta {
            font-size: .68rem;
            color: #9aa0a8;
            margin-bottom: 4px;
            display: flex;
            gap: 8px;
            align-items: baseline;
        }

        .msg.mine .meta { flex-direction: row-reverse; }

        .meta b { color: #33479c; font-size: .72rem; }
        .msg.mine .meta b { color: #7a4b9c; }

        .bubble {
            display: inline-block;
            padding: 9px 14px;
            border-radius: 14px;
            font-size: .86rem;
            line-height: 1.75;
            word-break: break-word;
            white-space: pre-wrap;
            background: rgba(255, 255, 255, .95);
            border: 1px solid rgba(0, 0, 0, .05);
            box-shadow: 0 3px 12px rgb(0 0 0 / .07);
        }

        .msg.mine .bubble {
            background: linear-gradient(135deg, #dbe6ff, #ece0ff);
            border-color: rgba(120, 155, 250, .25);
        }

        .del {
            display: none;
            margin-top: 4px;
            padding: 1px 8px;
            font-family: inherit;
            font-size: .64rem;
            color: #9aa0a8;
            border: 1px solid rgba(0, 0, 0, .08);
            border-radius: 8px;
            background: rgba(255, 255, 255, .7);
            cursor: pointer;
        }

        .msg.mine:hover .del { display: inline-block; }
        .del:hover { color: #b42318; border-color: rgba(180, 35, 24, .25); }

        .empty {
            text-align: center;
            color: #9aa0a8;
            font-size: .8rem;
            padding: 40px 0;
        }

        /* 输入区 */
        .composer {
            position: relative;
            flex: 0 0 auto;
            margin-top: 12px;
            display: flex;
            gap: 10px;
            align-items: flex-end;
            padding: 12px 14px;
            border-radius: 18px;
            background: rgba(255, 255, 255, .8);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, .66);
            box-shadow: rgb(0 0 0 / 0.12) 0px 8px 28px 0px;
        }

        .composer textarea {
            flex: 1 1 auto;
            min-height: 44px;
            max-height: 120px;
            padding: 11px 14px;
            font-family: inherit;
            font-size: .86rem;
            line-height: 1.7;
            color: #1f1f1f;
            background: rgba(255, 255, 255, .9);
            border: 1px solid rgba(0, 0, 0, .09);
            border-radius: 14px;
            outline: none;
            resize: none;
            transition: border-color .25s ease, box-shadow .25s ease;
        }

        .composer textarea:focus {
            border-color: rgba(120, 155, 250, .6);
            box-shadow: 0 0 0 3px #789bfa52;
        }

        .composer textarea:disabled { background: rgba(0, 0, 0, .04); color: #999; }

        .send {
            flex: 0 0 auto;
            padding: 11px 24px;
            font-family: inherit;
            font-size: .84rem;
            letter-spacing: 2px;
            color: #fff;
            border: none;
            border-radius: 13px;
            background: linear-gradient(135deg, #789bfa, #b48ce0);
            box-shadow: 0 5px 16px rgb(120 155 250 / .42);
            cursor: pointer;
            transition: all .3s ease;
        }

        .send:hover { box-shadow: 0 7px 22px rgb(120 155 250 / .55); }
        .send:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }

        .tip {
            position: absolute;
            top: -20px;
            left: 0;
            right: 0;
            font-size: .7rem;
            color: #9aa0a8;
            text-align: center;
            pointer-events: none;
            transition: opacity .25s ease;
        }

        .tip:empty { opacity: 0; }

        .tip.err { color: #c53030; }

        @media (max-width: 560px) {
            body { padding: 10px; }
            .bubble-wrap { max-width: 82%; }
        }
    </style>
</head>
<body>
<div class="wrap">

    <header class="bar">
        <a class="back" href="/index.html">← 首页</a>
        <span class="title">取代垃圾桶</span>
        {% if user %}
        <a class="who" href="/u/{{ user.id }}">
            {% if user.qq_id %}
            <img src="https://q.qlogo.cn/headimg_dl?dst_uin={{ user.qq_id }}&spec=640&img_type=jpg"
                 onerror="this.onerror=null;this.src='{{ url_for('static', filename='img/qun_avatar.jpg') }}';" alt="">
            {% endif %}
            {{ user.display_name }}
        </a>
        {% else %}
        <a class="back" style="margin-left:auto;" href="/login">登录后发言</a>
        {% endif %}
    </header>

    <div class="msgs" id="msgs">
        <p class="empty" id="empty">正在加载…</p>
    </div>

    <div class="composer">
        <textarea id="input" rows="1" maxlength="500"
                  placeholder="{{ '说点什么…（Enter 发送，Shift+Enter 换行）' if user else '登录后才能发言' }}"
                  {% if not user %}disabled{% endif %}></textarea>
        <button class="send" id="send" type="button" {% if not user %}disabled{% endif %}>发送</button>
        <div class="tip" id="tip"></div>
    </div>

</div>

<script>
(function () {
    'use strict';

    var msgs = document.getElementById('msgs');
    var empty = document.getElementById('empty');
    var input = document.getElementById('input');
    var sendBtn = document.getElementById('send');
    var tip = document.getElementById('tip');

    var LOGGED = {{ 'true' if user else 'false' }};
    var MYID = {{ user.id if user else 'null' }};
    var lastId = 0;
    var timer = null;

    var FALLBACK = '{{ url_for('static', filename='img/qun_avatar.jpg') }}';

    function esc(s) { return s; }   // 用 textContent，不需要转义

    function setTip(text, isErr) {
        tip.textContent = text || '';
        tip.className = 'tip' + (isErr ? ' err' : '');
        if (text) {
            clearTimeout(setTip._t);
            setTip._t = setTimeout(function () { tip.textContent = ''; }, 4000);
        }
    }

    function nearBottom() {
        return msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight < 120;
    }

    function scrollBottom() { msgs.scrollTop = msgs.scrollHeight; }

    function render(m) {
        var wrap = document.createElement('div');
        wrap.className = 'msg' + (m.user_id === MYID ? ' mine' : '');
        wrap.setAttribute('data-id', m.id);

        if (m.qq_id) {
            var av = document.createElement('img');
            av.className = 'av';
            av.loading = 'lazy';
            av.alt = m.nickname;
            av.src = 'https://q.qlogo.cn/headimg_dl?dst_uin=' + encodeURIComponent(m.qq_id) + '&spec=640&img_type=jpg';
            av.addEventListener('error', function () { this.onerror = null; this.src = FALLBACK; });
            if (m.user_id) {
                var avLink = document.createElement('a');
                avLink.href = '/u/' + m.user_id;
                avLink.target = '_blank';
                avLink.appendChild(av);
                wrap.appendChild(avLink);
            } else {
                wrap.appendChild(av);
            }
        } else {
            var avf = document.createElement('span');
            avf.className = 'avf';
            avf.textContent = (m.nickname || '?').charAt(0);
            if (m.user_id) {
                var fbLink = document.createElement('a');
                fbLink.href = '/u/' + m.user_id;
                fbLink.target = '_blank';
                fbLink.appendChild(avf);
                wrap.appendChild(fbLink);
            } else {
                wrap.appendChild(avf);
            }
        }

        var bw = document.createElement('div');
        bw.className = 'bubble-wrap';

        var meta = document.createElement('div');
        meta.className = 'meta';
        var nm = document.createElement('b');
        nm.textContent = m.nickname;
        var tm = document.createElement('time');
        tm.textContent = m.created_at;
        meta.appendChild(nm);
        meta.appendChild(tm);

        var bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = m.content;

        bw.appendChild(meta);
        bw.appendChild(bubble);

        if (m.user_id === MYID) {
            var del = document.createElement('button');
            del.className = 'del';
            del.type = 'button';
            del.textContent = '删除';
            del.addEventListener('click', function () { removeMsg(m.id, wrap); });
            bw.appendChild(del);
        }

        wrap.appendChild(bw);
        return wrap;
    }

    function removeMsg(id, el) {
        if (!confirm('删除这条消息？')) { return; }
        fetch('/api/chat/' + id + '/delete', { method: 'POST', cache: 'no-store' })
            .then(function (r) { return r.json(); })
            .then(function (d) {
                if (!d.ok) { setTip(d.msg || '删除失败', true); return; }
                if (el && el.parentNode) { el.parentNode.removeChild(el); }
                if (!msgs.querySelector('.msg')) {
                    msgs.innerHTML = '<p class="empty">还没有人说话，来开个头吧</p>';
                    empty = msgs.querySelector('.empty');
                }
            })
            .catch(function () { setTip('网络错误', true); });
    }

    function append(list) {
        if (!list.length) { return; }
        var stick = nearBottom();

        var e = msgs.querySelector('.empty');
        if (e) { e.remove(); }

        list.forEach(function (m) {
            if (lastId && m.id <= lastId) { return; }
            msgs.appendChild(render(m));
            if (m.id > lastId) { lastId = m.id; }
        });

        if (stick) { scrollBottom(); }
    }

    function load(after) {
        var url = '/api/chat/messages' + (after ? ('?after=' + after) : '');
        return fetch(url, { cache: 'no-store' })
            .then(function (r) { return r.json(); })
            .then(function (d) {
                if (!d.ok) { throw new Error('bad'); }
                if (!after) {
                    msgs.innerHTML = '';
                    if (!d.messages.length) {
                        msgs.innerHTML = '<p class="empty">还没有人说话，来开个头吧</p>';
                        return;
                    }
                    d.messages.forEach(function (m) {
                        msgs.appendChild(render(m));
                        if (m.id > lastId) { lastId = m.id; }
                    });
                    scrollBottom();
                } else {
                    append(d.messages);
                }
            });
    }

    function poll() {
        load(lastId).catch(function () {});
    }

    /* ---- 首次加载 ---- */
    load(0).then(function () {
        if (LOGGED) {
            timer = setInterval(poll, 2500);
        }
    }).catch(function () {
        msgs.innerHTML = '<p class="empty">加载失败，刷新试试</p>';
    });

    /* ---- 发送 ---- */
    function doSend() {
        if (!LOGGED) { return; }
        var content = (input.value || '').trim();
        if (!content) { return; }

        sendBtn.disabled = true;
        fetch('/api/chat/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8' },
            body: 'content=' + encodeURIComponent(content),
            cache: 'no-store'
        })
            .then(function (r) { return r.json(); })
            .then(function (d) {
                if (!d.ok) { setTip(d.msg || '发送失败', true); sendBtn.disabled = false; return; }
                input.value = '';
                autoGrow();
                var stick = nearBottom();
                append([d.message]);
                if (stick) { scrollBottom(); }
                sendBtn.disabled = false;
                input.focus();
            })
            .catch(function () {
                setTip('网络错误，请稍后再试', true);
                sendBtn.disabled = false;
            });
    }

    sendBtn.addEventListener('click', doSend);

    input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            doSend();
        }
    });

    function autoGrow() {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    }

    input.addEventListener('input', autoGrow);

    /* 页面回到前台时立刻拉一次 */
    document.addEventListener('visibilitychange', function () {
        if (!document.hidden && LOGGED) { poll(); }
    });

    window.addEventListener('beforeunload', function () {
        if (timer) { clearInterval(timer); }
    });
})();
</script>
</body>
</html>
