<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="登录页面" content="width=device-width, initial-scale=1.0">
    <title>登录页面</title>
    <style>
        body{background: linear-gradient(rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.3)), 
                url("{{ url_for('static', filename='img/background.png') }}") center/cover no-repeat;
                background-position: center center;
                background-size: cover;
                background-attachment: fixed;
                position: relative;
                flex-direction:column;
                display: flex;
                align-items: center;
                
            }

        .login{
            width: 500px;
            height: 500px;
            background: rgb(255 255 255 / 0.06);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 15px;
            border: 1px solid rgb(255 255 255 / 0.16);
            box-shadow: rgb(0 0 0 / 0.35) 0px 8px 32px 0px; 
            /* margin-left: 77.5%; */
            margin-top: 5%;
            animation: all 1s ease-out forwards;
            /* display: flex; */
            flex-grow: 1;
        }
               .coolinput {
            display: flex;
            flex-direction: column;
            width: fit-content;
            position: static;
            max-width: 240px;
            }

.coolinput label.text {
  font-size: 0.75rem;
  color: #000000;
  font-weight: 700;
  position: relative;
  top: 0.5rem;
  margin: 0 0 0 7px;
  padding: 0 3px;
  background: rgb(255 255 255 / 0.06);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: 15px;
    border: 1px solid rgb(255 255 255 / 0.16);
    box-shadow: rgb(0 0 0 / 0.35) 0px 8px 32px 0px; 
  width: fit-content;
}

.coolinput input[type="text"].input {
  padding: 10px 50px;
  font-size: 0.75rem;
  border: 2px #000000 solid;
  border-radius: 5px;
  background: rgb(255 255 255 / 0.06);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: 15px;
    border: 1px solid rgb(255 255 255 / 0.16);
    box-shadow: rgb(0 0 0 / 0.35) 0px 8px 32px 0px; 
}




.jztheme-tools-css-button-hover {
    padding: 10px 25px;
    background: rgb(255 255 255 / 0.06);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-radius: 15px;
  
  box-shadow: rgb(0 0 0 / 0.35) 0px 8px 32px 0px; 
    border: none;
    cursor: pointer;
    transition: all 0.3s ease;
    
}

.jztheme-tools-css-button-hover:hover {
    background: #789bfa71;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-radius: 15px;
  box-shadow: 0 0 18px #e6b5e6;
  /* box-shadow: rgb(0 0 0 / 0.35) 0px 8px 32px 0px; */
    
}


.button-Join{
    margin-top: 5%;
}.coolinput input[type="text"].input:focus {
  outline: none;
}
    </style>
</head>
<body>
    <div class="login">
        <h1 align="center">登录</h1>
        <form action="login"method="post">
            <div class="coolinput">
            <label class="text" for="input">用户名：</label>
            <input class="input" name="username" placeholder="在此输入..." type="text" >
            </div>
            <div class="coolinput">
            <label class="text" for="input">密码：</label>
            <input class="input" name="password" placeholder="在此输入..." type="text" >
            </div>
            <div class="button-Join">
                <button class="jztheme-tools-css-button-hover"type="submit">登录</button></a>
            </div>

        </form>
    </div>
</body>
</html>
