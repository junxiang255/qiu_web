<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言板 · 小秋的垃圾站</title>
    <meta name="description" content="留言板：留句闲话再走。可以给站长留言，站长会回复。">
    <link rel="shortcut icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/font.css') }}">
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 16px 16px 60px;
            background: linear-gradient(rgba(255, 255, 255, .2), rgba(255, 255, 255, .3)),
                        url("{{ url_for('static', filename='img/background.png') }}") center/cover no-repeat fixed;
            font-family: "筑紫A圆体D", system-ui, sans-serif;
            color: #1f1f1f;
        }

        .wrap { width: min(760px, 100%); margin: 0 auto; }

        .bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            border-radius: 18px;
            background: rgba(255, 255, 255, .8);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, .66);
            box-shadow: rgb(0 0 0 / 0.12) 0px 8px 28px 0px;
        }

        .back {
            font-size: .8rem;
            color: #333;
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 11px;
            background: rgba(255, 255, 255, .6);
            border: 1px solid rgba(0, 0, 0, .07);
            transition: all .3s ease;
        }

        .back:hover { background: #789bfa71; box-shadow: 0 0 18px #e6b5e6; }

        .title { font-size: .9rem; font-weight: 700; letter-spacing: 3px; }
        .title span { color: #8d9299; font-size: .76rem; font-weight: 400; }

        .who {
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: .76rem;
            color: #444;
            text-decoration: none;
        }

        .who img {
            width: 26px; height: 26px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #fff;
            box-shadow: 0 2px 8px rgb(0 0 0 / .18);
        }

        /* 写留言 */
        .editor {
            margin-top: 14px;
            padding: 16px;
            border-radius: 18px;
            background: rgba(255, 255, 255, .8);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, .66);
            box-shadow: rgb(0 0 0 / 0.12) 0px 8px 28px 0px;
        }

        .editor textarea {
            width: 100%;
            min-height: 76px;
            padding: 12px 14px;
            font-family: inherit;
            font-size: .86rem;
            line-height: 1.8;
            color: #1f1f1f;
            background: rgba(255, 255, 255, .92);
            border: 1px solid rgba(0, 0, 0, .09);
            border-radius: 14px;
            outline: none;
            resize: vertical;
            transition: border-color .25s ease, box-shadow .25s ease;
        }

        .editor textarea:focus {
            border-color: rgba(120, 155, 250, .6);
            box-shadow: 0 0 0 3px #789bfa52;
        }

        .editor textarea:disabled { background: rgba(0, 0, 0, .04); color: #999; }

        .editor-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
        }

        .hint { font-size: .72rem; color: #9aa0a8; }
        .hint.err { color: #c53030; }
        .hint.ok { color: #2f855a; }

        .btn {
            margin-left: auto;
            padding: 9px 24px;
            font-family: inherit;
            font-size: .84rem;
            letter-spacing: 2px;
            color: #fff;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #789bfa, #b48ce0);
            box-shadow: 0 5px 16px rgb(120 155 250 / .42);
            cursor: pointer;
            transition: all .3s ease;
        }

        .btn:hover { box-shadow: 0 7px 22px rgb(120 155 250 / .55); }
        .btn:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }

        .btn.ghost {
            color: #333;
            background: rgba(255, 255, 255, .85);
            border: 1px solid rgba(0, 0, 0, .08);
            box-shadow: 0 3px 12px rgb(0 0 0 / .08);
            text-decoration: none;
            display: inline-block;
        }

        .btn.ghost:hover { background: #789bfa71; }

        /* 留言列表 */
        .list { margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }

        .entry {
            padding: 16px 18px;
            border-radius: 16px;
            background: rgba(255, 255, 255, .8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, .58);
            box-shadow: rgb(0 0 0 / 0.1) 0px 6px 22px 0px;
            animation: fade_in .4s ease-out both;
        }

        .entry-head {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 9px;
        }

        .entry-head img.av {
            width: 32px; height: 32px;
            flex: 0 0 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #fff;
            box-shadow: 0 2px 8px rgb(0 0 0 / .16);
        }

        .entry-head .avf {
            width: 32px; height: 32px;
            flex: 0 0 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: .78rem;
            font-weight: 700;
            color: #7d8798;
            background: linear-gradient(135deg, #e7ecf7, #cfd9ec);
            border: 2px solid #fff;
        }

        .entry-head b { font-size: .82rem; color: #33479c; }
        .entry-head time { font-size: .7rem; color: #9aa0a8; }

        .entry-head .act {
            margin-left: auto;
            display: flex;
            gap: 6px;
            opacity: 0;
            transition: opacity .2s ease;
        }

        .entry:hover .act { opacity: 1; }

        .mini {
            padding: 2px 10px;
            font-family: inherit;
            font-size: .68rem;
            color: #9aa0a8;
            border: 1px solid rgba(0, 0, 0, .08);
            border-radius: 8px;
            background: rgba(255, 255, 255, .8);
            cursor: pointer;
            transition: all .25s ease;
        }

        .mini:hover { color: #333; background: #789bfa71; }
        .mini.danger:hover { color: #b42318; border-color: rgba(180, 35, 24, .25); background: rgba(255, 241, 241, .9); }

        .entry-body {
            font-size: .87rem;
            line-height: 1.9;
            color: #3a3a3a;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* 管理员回复 */
        .reply {
            margin-top: 12px;
            padding: 11px 14px;
            border-radius: 12px;
            font-size: .82rem;
            line-height: 1.85;
            background: rgba(219, 230, 255, .55);
            border-left: 3px solid #789bfa;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .reply b { color: #33479c; margin-right: 6px; }
        .reply .who-tag { font-size: .68rem; color: #8d9299; }

        .reply-form {
            margin-top: 10px;
            display: none;
            gap: 8px;
            flex-direction: column;
        }

        .reply-form.on { display: flex; }

        .reply-form textarea {
            width: 100%;
            min-height: 60px;
            padding: 9px 12px;
            font-family: inherit;
            font-size: .82rem;
            line-height: 1.8;
            border: 1px solid rgba(0, 0, 0, .09);
            border-radius: 10px;
            background: rgba(255, 255, 255, .95);
            outline: none;
            resize: vertical;
        }

        .reply-form textarea:focus { border-color: rgba(120, 155, 250, .6); }

        .reply-form .row { display: flex; gap: 8px; justify-content: flex-end; }

        .empty {
            text-align: center;
            color: #9aa0a8;
            font-size: .82rem;
            padding: 46px 0;
        }

        @keyframes fade_in {
            0% { opacity: 0; transform: translateY(8px); }
            100% { opacity: 1; transform: none; }
        }

        @media (max-width: 560px) {
            body { padding: 10px 10px 40px; }
            .entry-head .act { opacity: 1; }
        }
    </style>
</head>
<body>
<div class="wrap">

    <header class="bar">
        <a class="back" href="/index.html">← 首页</a>
        <h1 class="title">留言板 <span id="count">（{{ total }} 条）</span></h1>
