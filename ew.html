<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>垃圾桶之夜名单 · 小秋的垃圾站</title>
    <meta name="description" content="垃圾桶之夜名单——本周乐色王前三名，看看这周谁上榜了。">
    <link rel="shortcut icon" href="static/img/favicon.ico">
    <script src="static/js/ranking.js"></script>
    <script src="static/js/top_name.js"></script>
    <script src="static/js/top_qqid.js"></script>
    <style>
        * { box-sizing: border-box; }

        html, body {
            max-width: 100%;
            overflow-x: hidden;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 16px 16px 50px;
            background: linear-gradient(rgba(255, 255, 255, .18), rgba(255, 255, 255, .28)),
                        url("static/img/background.png") center/cover no-repeat fixed;
            font-family: "筑紫A圆体D", system-ui, -apple-system, sans-serif;
            color: #1f1f1f;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ---------- 顶栏 ---------- */
        .tb {
            width: min(1100px, 100%);
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            border-radius: 18px;
            background: rgba(255, 255, 255, .8);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, .66);
            box-shadow: rgb(0 0 0 / .12) 0 8px 28px 0;
            margin-bottom: 22px;
        }

        .tb-brand {
            display: flex;
            align-items: center;
            gap: 9px;
            text-decoration: none;
            color: #1f1f1f;
            flex: 0 0 auto;
        }

        .tb-avatar {
            width: 38px;
            height: 38px;
            border-radius: 999px;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, .9);
            box-shadow: 0 2px 10px rgb(0 0 0 / .12);
        }

        .tb-name {
            font-size: .8rem;
            font-weight: 700;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .tb-links {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1 1 auto;
            min-width: 0;
            overflow: hidden;
        }

        .tb-links a {
            font-size: .74rem;
            color: #333;
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 11px;
            background: rgba(255, 255, 255, .6);
            border: 1px solid rgba(0, 0, 0, .07);
            transition: all .3s ease;
            white-space: nowrap;
        }

        .tb-links a:hover { background: #789bfa71; box-shadow: 0 0 18px #e6b5e6; }

        .tb-account {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 0 0 auto;
            margin-left: auto;
            text-decoration: none;
            color: #1f1f1f;
        }

        .tb-user-avatar {
            width: 34px;
            height: 34px;
            border-radius: 999px;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, .9);
            box-shadow: 0 2px 10px rgb(0 0 0 / .12);
        }

        .tb-user-name {
            font-size: .76rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .tb-checkin {
            flex: 0 0 auto;
            padding: 7px 16px;
            font-size: .8rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #333;
            text-decoration: none;
            border-radius: 11px;
            background: #fff;
            border: 1px solid rgba(0, 0, 0, .08);
            box-shadow: 0 3px 12px rgb(0 0 0 / .1);
            transition: all .3s ease;
            white-space: nowrap;
        }

        .tb-checkin:hover {
            text-decoration: none;
            box-shadow: 0 5px 18px rgb(0 0 0 / .16);
            transform: translateY(-1px);
        }

        .tb-home {
            flex: 0 0 auto;
            padding: 7px 16px;
            font-size: .8rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #333;
            text-decoration: none;
            border-radius: 11px;
            background: rgba(255, 255, 255, .85);
            border: 1px solid rgba(0, 0, 0, .08);
            box-shadow: 0 3px 12px rgb(0 0 0 / .1);
            transition: all .3s ease;
            white-space: nowrap;
        }

        .tb-home:hover { box-shadow: 0 5px 18px rgb(0 0 0 / .16); transform: translateY(-1px); }

        /* ---------- 表情包 ---------- */
        .han_win {
            width: min(400px, 78vw);
            margin: 0 auto -6px;
            position: relative;
            z-index: 1;
        }

        .han_win img {
            width: 100%;
            height: auto;
            display: block;
            filter: drop-shadow(0 12px 28px rgba(120, 100, 140, .22));
        }

        /* ---------- 榜单卡片 ---------- */
        .rank-board {
            width: min(560px, 92vw);
            margin: 0 auto;
            padding: 26px 24px 28px;
            border-radius: 26px;
            background: rgba(255, 255, 255, .88);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, .78);
            box-shadow: 0 18px 52px rgba(120, 100, 140, .22);
            position: relative;
            z-index: 2;
        }

        .rank-title {
            margin: 0 0 20px;
            font-size: 1.45rem;
            font-weight: 900;
            letter-spacing: 8px;
            text-align: center;
            color: #1f1f1f;
            text-shadow: 0 1px 2px rgba(255, 255, 255, .8);
        }

        .rank-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .rank-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            border-radius: 16px;
            background: rgba(255, 255, 255, .72);
            border: 1px solid rgba(0, 0, 0, .05);
            transition: transform .25s ease;
        }

        .rank-item:hover { transform: translateX(3px); }

        .rank-item[data-rank="1"] {
            background: linear-gradient(135deg, rgba(255, 215, 130, .38), rgba(255, 170, 190, .26));
            border-color: rgba(255, 180, 90, .45);
            box-shadow: 0 4px 18px rgba(255, 180, 90, .2);
        }

        .rank-item[data-rank="2"] {
            background: linear-gradient(135deg, rgba(200, 220, 245, .38), rgba(220, 235, 250, .28));
            border-color: rgba(150, 190, 230, .4);
        }

        .rank-item[data-rank="3"] {
            background: linear-gradient(135deg, rgba(232, 210, 242, .38), rgba(245, 225, 245, .28));
            border-color: rgba(200, 160, 220, .4);
        }

        .rank-medal {
            flex: 0 0 auto;
            width: 26px;
            font-size: 1.2rem;
            text-align: center;
            line-height: 1;
        }

        .rank-ava {
            flex: 0 0 auto;
            width: 58px;
            height: 58px;
            border-radius: 999px;
            overflow: hidden;
            background: #f0edf3;
            box-shadow: 0 3px 14px rgba(0, 0, 0, .14);
            border: 2px solid rgba(255, 255, 255, .9);
        }

        .rank-ava img,
        .rank-ava .div_pp {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .rank-info {
            flex: 1 1 auto;
            min-width: 0;
        }

        .rank-name {
            margin: 0;
            font-size: 1.02rem;
            font-weight: 700;
            color: #1f1f1f;
            line-height: 1.35;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .rank-qq {
            margin: 5px 0 0;
            font-size: .74rem;
            color: #8d9299;
            letter-spacing: 1px;
        }

        .rank-qq b {
            color: #5a6ea8;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        /* ---------- 按钮 ---------- */
        .button-Join {
            width: min(560px, 92vw);
            text-align: center;
            margin-top: 14px;
        }

        .button-Join button {
            width: 100%;
            padding: 12px 38px;
            font-family: inherit;
            font-size: .86rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: #fff;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            background: linear-gradient(135deg, #789bfa, #b48ce0);
            box-shadow: 0 5px 20px rgba(120, 155, 250, .45);
            transition: all .3s ease;
        }

        .button-Join button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 28px rgba(120, 155, 250, .6);
        }

        .button-Join.back button {
            background: rgba(255, 255, 255, .9);
            color: #555;
            box-shadow: 0 3px 14px rgba(0, 0, 0, .1);
        }

        .button-Join.back button:hover {
            background: #fff;
            box-shadow: 0 5px 20px rgba(0, 0, 0, .15);
        }

        @media (max-width: 560px) {
            body { padding: 10px 10px 40px; }
            .rank-board { width: 94vw; padding: 20px 16px 22px; }
            .rank-title { font-size: 1.2rem; letter-spacing: 4px; }
            .rank-ava { width: 50px; height: 50px; }
            .rank-name { font-size: .95rem; }
            .rank-item { gap: 10px; padding: 10px 12px; }
            .han_win { width: 68vw; }
            .tb-name { display: none; }
            .tb-links { display: none; }
        }
    </style>
    <!-- Microsoft Clarity -->
    <script>
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i+"?ref=bwt";
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "zim1v5iu9g");
    </script>
</head>
<body>

<header class="tb">
    <a class="tb-brand" href="https://qm.qq.com/q/YcYmHiZN2C" target="_blank" rel="noopener">
        <img class="tb-avatar" src="static/img/qun_avatar.jpg" alt="小秋の垃圾桶">
        <span class="tb-name">小秋の垃圾桶</span>
    </a>
    <div class="tb-links"></div>
    <a class="tb-account" id="tb-account" href="index.html" hidden>
        <img class="tb-user-avatar" id="tb-user-avatar" alt="">
        <span class="tb-user-name" id="tb-user-name"></span>
    </a>
    <a class="tb-checkin" href="checkin">签到</a>
    <a class="tb-home" href="index.html">主页</a>
</header>

<div class="han_win">
    <img src="static/img/han_win.gif" alt="hanser">
</div>

<div class="rank-board">
    <h1 class="rank-title">本周乐色王</h1>

    <div class="rank-list">
        <div class="rank-item" data-rank="1">
            <span class="rank-medal">🥇</span>
            <div class="rank-ava" id="top1_img"></div>
            <div class="rank-info">
                <h3 class="rank-name" id="top1_name"></h3>
                <p class="rank-qq">QQ <b id="top1_qqid"></b></p>
            </div>
        </div>

        <div class="rank-item" data-rank="2">
            <span class="rank-medal">🥈</span>
            <div class="rank-ava" id="top2_img"></div>
            <div class="rank-info">
                <h3 class="rank-name" id="top2_name"></h3>
                <p class="rank-qq">QQ <b id="top2_qqid"></b></p>
            </div>
        </div>

        <div class="rank-item" data-rank="3">
            <span class="rank-medal">🥉</span>
            <div class="rank-ava" id="top3_img"></div>
            <div class="rank-info">
                <h3 class="rank-name" id="top3_name"></h3>
                <p class="rank-qq">QQ <b id="top3_qqid"></b></p>
            </div>
        </div>
    </div>
</div>

<div class="button-Join">
    <a href="https://qm.qq.com/q/YcYmHiZN2C" target="_blank" rel="noopener" style="text-decoration:none;">
        <button type="button">加入我们</button>
    </a>
</div>

<div class="button-Join back">
    <a href="index.html" style="text-decoration:none;">
        <button type="button">返回首页</button>
    </a>
</div>

<script>
/* 顶栏账号区 */
(function () {
    'use strict';
    var accEl = document.getElementById('tb-account');
    if (!accEl) { return; }

    fetch('/api/me', { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (d) {
            if (!d || !d.logged_in) { return; }

            var img = document.getElementById('tb-user-avatar');
            var nameEl = document.getElementById('tb-user-name');
            if (d.id) { img.src = '/avatar/' + d.id + '?v=2'; }
            if (d.profile_url) { accEl.href = d.profile_url; }
            if (nameEl) { nameEl.textContent = d.display_name || d.username || '账号'; }
            accEl.hidden = false;
        })
        .catch(function () {});
})();
</script>

<script>
/* 开发者标签配色 */
(function () {
    fetch('/api/theme', { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (d) {
            var cs = (d && d.colors) || [];
            if (!cs.length) { return; }
            cs.forEach(function (c, i) {
                document.documentElement.style.setProperty('--dev-' + (i + 1), c);
            });
        })
        .catch(function () {});
})();
</script>

</body>
</html>
